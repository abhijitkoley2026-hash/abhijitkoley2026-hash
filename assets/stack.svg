<svg xmlns="http://www.w3.org/2000/svg" width="920" height="455" viewBox="0 0 920 455" role="img">
<title>Abhijit Koley — GitHub profile</title>

<defs>
  <linearGradient id="stackborder" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#247bff" stop-opacity=".95"/>
    <stop offset=".55" stop-color="#247bff" stop-opacity=".16"/>
    <stop offset="1" stop-color="#ff354f" stop-opacity=".9"/>
  </linearGradient>
  <linearGradient id="stackshine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".14"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="stackdots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#a9c8ff" opacity=".12"/>
  </pattern>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;fill:#f5f7ff}
    .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;letter-spacing:1.5px}
    .muted{fill:#aab5ce}.blue{fill:#69a2ff}.red{fill:#ff6477}
    .eyebrow{font-size:13px;font-weight:700;letter-spacing:3px}
    .body{font-size:16px}.small{font-size:12px}
    .card{fill:#0d1425;stroke:#26344e;stroke-width:1}
    .line{stroke:#26344e;stroke-width:1}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  </style>
</defs>

<rect width="920" height="455" rx="26" fill="#070b16"/>
<rect width="920" height="455" rx="26" fill="url(#stackdots)"/>
<rect x="1" y="1" width="918" height="453" rx="25" fill="none" stroke="url(#stackborder)"/>

<text x="40" y="48" class="eyebrow blue">03 / TOOLKIT</text><text x="40" y="98" font-size="35" font-weight="800">Tools I’m growing with.</text>
<g transform="translate(275 255)">
  <ellipse rx="220" ry="75" fill="none" stroke="#247bff" stroke-opacity=".8" stroke-width="2" transform="rotate(-22)"/>
  <ellipse rx="220" ry="75" fill="none" stroke="#ff354f" stroke-opacity=".65" stroke-width="2" transform="rotate(42)"/>
  <ellipse rx="220" ry="75" fill="none" stroke="#6b8dbd" stroke-opacity=".75" stroke-width="2" transform="rotate(90)"/>
  <g transform="rotate(-22)"><animateTransform attributeName="transform" type="rotate" values="-22;338" dur="36s" repeatCount="indefinite" begin="0s"/></g>
  <circle cx="0" cy="0" r="66" fill="#101b30" stroke="#334765"/>
  <text x="0" y="-5" text-anchor="middle" font-size="23" font-weight="800">STACK</text><text x="0" y="19" text-anchor="middle" class="small muted">IN PROGRESS</text>
  <g transform="translate(-205 -62)"><rect width="106" height="42" rx="21" fill="#101b30" stroke="#247bff"/><text x="53" y="27" text-anchor="middle" font-size="15" font-weight="700">C++</text></g>
  <g transform="translate(108 -114)"><rect width="112" height="42" rx="21" fill="#101b30" stroke="#ff354f"/><text x="56" y="27" text-anchor="middle" font-size="15" font-weight="700">HTML</text></g>
  <g transform="translate(180 58)"><rect width="100" height="42" rx="21" fill="#101b30" stroke="#247bff"/><text x="50" y="27" text-anchor="middle" font-size="15" font-weight="700">CSS</text></g>
  <g transform="translate(-42 104)"><rect width="112" height="42" rx="21" fill="#101b30" stroke="#ff354f"/><text x="56" y="27" text-anchor="middle" font-size="15" font-weight="700">JavaScript</text></g>
  <g transform="translate(-240 70)"><rect width="112" height="42" rx="21" fill="#101b30" stroke="#247bff"/><text x="56" y="27" text-anchor="middle" font-size="15" font-weight="700">Git/GitHub</text></g>
</g>
<g transform="translate(555 142)">
  <text x="0" y="0" class="eyebrow red">LANGUAGES &amp; CORE</text>
  <rect y="18" width="300" height="38" rx="12" class="card"/><text x="16" y="42" font-size="15">C++ • DSA fundamentals</text>
  <rect y="66" width="300" height="38" rx="12" class="card"/><text x="16" y="90" font-size="15">HTML • CSS • JavaScript</text>
  <rect y="114" width="300" height="38" rx="12" class="card"/><text x="16" y="138" font-size="15">Python • exploring</text>
  <text x="0" y="198" class="eyebrow blue">WORKFLOW</text>
  <rect y="216" width="300" height="38" rx="12" class="card"/><text x="16" y="240" font-size="15">VS Code • Git • GitHub</text>
</g>

</svg>